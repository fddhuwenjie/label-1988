server:
  port: 8080

# CORS 配置：生产环境应限制具体域名，开发环境可使用 *
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

spring:
  application:
    name: tare-backend
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

logging:
  level:
    root: INFO
    com.tare: DEBUG
    com.tare.service: INFO
    com.tare.controller: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{traceId}] %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{traceId}] %msg%n"
  file:
    name: logs/tare-backend.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
